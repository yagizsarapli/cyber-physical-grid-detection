name: Build final paper

on:
  push:
    branches: [main]
    paths-ignore:
      - 'paper/main.pdf'
      - 'figures/paper_fig2_latency_waterfall.png'
      - 'figures/paper_fig3_zeroday_generalization.png'
      - 'figures/paper_fig4_scale_comparison.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX and Python plotting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers python3-matplotlib zip

      - name: Regenerate publication figures from final reported values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np
          import matplotlib.pyplot as plt

          FIGURES = Path("figures")
          FIGURES.mkdir(exist_ok=True)

          BLUE = "#2a78d6"
          ORANGE = "#eb6834"
          AQUA = "#1baf7a"
          GOOD = "#0ca30c"
          CRITICAL = "#d03b3b"
          INK = "#0b0b0b"
          INK_SECONDARY = "#52514e"
          INK_MUTED = "#898781"
          GRIDLINE = "#e1e0d9"
          BASELINE = "#c3c2b7"
          SURFACE = "#fcfcfb"

          plt.rcParams.update({
              "font.family": "sans-serif",
              "font.sans-serif": ["Helvetica", "Arial", "DejaVu Sans"],
              "axes.edgecolor": BASELINE,
              "axes.labelcolor": INK,
              "text.color": INK,
              "xtick.color": INK_SECONDARY,
              "ytick.color": INK_SECONDARY,
              "figure.facecolor": SURFACE,
              "axes.facecolor": SURFACE,
              "savefig.facecolor": SURFACE,
          })

          def style_axes(ax, ygrid=True):
              ax.spines["top"].set_visible(False)
              ax.spines["right"].set_visible(False)
              ax.spines["left"].set_color(BASELINE)
              ax.spines["bottom"].set_color(BASELINE)
              if ygrid:
                  ax.yaxis.grid(True, color=GRIDLINE, linewidth=1, zorder=0)
                  ax.set_axisbelow(True)
              ax.tick_params(length=0)

          def labels(ax, bars, fmt="{:.3f}", dy=0.02):
              for b in bars:
                  h=b.get_height()
                  ax.annotate(fmt.format(h), (b.get_x()+b.get_width()/2, h+dy),
                              ha="center", va="bottom", fontsize=9, color=INK)

          # Figure 2: latest documented N=300 run.
          final_median_ms = 16.154562
          steps = [
              ("Original pipeline\n(Random Forest)", 42.98, INK_MUTED),
              ("+ Warm start", 37.14, CRITICAL),
              ("+ In-place measurement\nupdate", 22.62, ORANGE),
              ("+ Logistic regression", 19.60, ORANGE),
              ("Final tuned pipeline\n(N=300)", final_median_ms, GOOD),
          ]
          fig, ax = plt.subplots(figsize=(8.5,4.4))
          x=np.arange(len(steps))
          bars=ax.bar(x,[s[1] for s in steps],color=[s[2] for s in steps],width=0.6,zorder=3)
          ax.axhline(20.0,color=INK,linewidth=1.4,linestyle=(0,(4,3)),zorder=2)
          ax.annotate("20 ms budget (1 cycle @ 50 Hz)",xy=(0.55,20.0),xytext=(0.55,23.0),
                      ha="left",fontsize=9,color=INK)
          ax.set_xticks(x)
          ax.set_xticklabels([s[0] for s in steps],fontsize=8.8)
          ax.set_ylabel("Median end-to-end latency (ms)")
          labels(ax,bars,fmt="{:.1f} ms",dy=0.6)
          style_axes(ax)
          ax.set_ylim(0,50)
          fig.suptitle("End-to-end latency after successive pipeline optimizations",
                       fontsize=11.5,color=INK)
          fig.tight_layout()
          fig.savefig(FIGURES/"paper_fig2_latency_waterfall.png",dpi=200,bbox_inches="tight")
          plt.close(fig)

          # Figure 3: values reported in Table II.
          seen=np.array([0.907,1.000])
          held=np.array([0.000,0.013])
          fig, ax=plt.subplots(figsize=(7,4.1))
          x=np.arange(2); w=0.35
          b1=ax.bar(x-w/2,seen,width=w,color=BLUE,label="Seen in training",zorder=3)
          b2=ax.bar(x+w/2,held,width=w,color=CRITICAL,label="Attack type withheld",zorder=3)
          ax.set_xticks(x)
          ax.set_xticklabels(["Naive single-sensor\ncorruption","Model-consistent\n(stealth) FDIA"],fontsize=10)
          ax.set_ylabel("Recall on that attack type")
          ax.set_ylim(0,1.12)
          labels(ax,b1,dy=0.03); labels(ax,b2,dy=0.03)
          ax.legend(frameon=False,loc="upper center",bbox_to_anchor=(0.5,1.12),ncol=2,fontsize=9.5)
          style_axes(ax)
          fig.tight_layout()
          fig.savefig(FIGURES/"paper_fig3_zeroday_generalization.png",dpi=200,bbox_inches="tight")
          plt.close(fig)

          # Figure 4: four-seed means reported in Table III.
          order=["Topology fusion","Residual+prior","Prior only","Residual only"]
          colors=[BLUE,AQUA,ORANGE,INK_SECONDARY]
          det=np.array([
              [0.945,0.938,0.848,0.682],
              [0.870,0.873,0.700,0.656],
              [0.871,0.832,0.672,0.653],
          ])
          loc=np.array([
              [0.958,0.965,0.680,0.548],
              [0.918,0.895,0.528,0.447],
              [0.910,0.908,0.515,0.427],
          ])
          fig, axes=plt.subplots(1,2,figsize=(11,4.2))
          for ax,data,title in [
              (axes[0],det,"Detection (balanced accuracy)"),
              (axes[1],loc,"Localization (top-1 accuracy)"),
          ]:
              x=np.arange(3); w=0.19
              for i,(name,color) in enumerate(zip(order,colors)):
                  bars=ax.bar(x+(i-1.5)*w,data[:,i],width=w,color=color,zorder=3,
                              label=name if ax is axes[0] else None)
                  labels(ax,bars,fmt="{:.2f}",dy=0.02)
              ax.set_xticks(x)
              ax.set_xticklabels(["5-bus","IEEE 14-bus","IEEE 30-bus"],fontsize=9.5)
              ax.set_ylim(0,1.15)
              ax.set_title(title,fontsize=11,color=INK,pad=10)
              style_axes(ax)
          axes[0].legend(frameon=False,loc="upper center",bbox_to_anchor=(1.15,1.15),ncol=4,fontsize=8.8)
          fig.tight_layout()
          fig.savefig(FIGURES/"paper_fig4_scale_comparison.png",dpi=200,bbox_inches="tight")
          plt.close(fig)
          PY

      - name: Static-check live experiment scripts
        run: |
          python3 -m py_compile \
            21_nonlinear_stealth_fdia_bdd_benchmark_HARD.py \
            22_graph_ready_protected_prior_telemetry_HARD.py \
            22_graph_ready_protected_prior_telemetry_HARDER.py \
            23_topology_aware_cyber_physical_localization_HARD.py \
            23_topology_aware_cyber_physical_localization_HARDER.py \
            24_realtime_latency_benchmark.py \
            24_realtime_latency_benchmark_WARMSTART.py \
            24_realtime_latency_benchmark_OPTIMIZED.py \
            24_realtime_latency_benchmark_FINAL.py \
            25_wls_overhead_diagnostic.py \
            26_multi_seed_replication.py \
            27_held_out_attack_type_generalization.py \
            28_ieee14_scale_replication.py \
            29_paper_figures.py \
            30_ieee14_multi_seed_replication.py \
            31_ieee30_scale_replication.py \
            32_ieee30_multi_seed_replication.py \
            33_feature_redundancy_diagnostic.py \
            34_prior_uncertainty_sensitivity.py \
            exploration/01_microgrid_topology.py \
            exploration/08_multirate_operating_dataset.py

      - name: Compile canonical manuscript
        run: |
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eiq 'undefined references|Citation .* undefined|Reference .* undefined|There were undefined references|LaTeX Error|Emergency stop|Fatal error occurred' main.log; then
            echo "LaTeX log contains unresolved references or fatal errors."
            exit 1
          fi

      - name: Commit refreshed PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.pdf figures/paper_fig2_latency_waterfall.png figures/paper_fig3_zeroday_generalization.png figures/paper_fig4_scale_comparison.png
          if git diff --cached --quiet; then
            echo "No generated-file changes to commit."
          else
            git commit -m "Rebuild final manuscript PDF"
            git push
          fi

      - name: Upload final paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-paper
          path: |
            paper/main.pdf
          if-no-files-found: error
